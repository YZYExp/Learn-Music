<svg xmlns="http://www.w3.org/2000/svg" width="900" height="880" viewBox="0 0 900 880"><rect width="900" height="880" fill="#faf7ef"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#23343b"><text x="40" y="62" font-size="34" fill="#23343b">从可重复的小动作开始</text><rect x="32" y="112.0" width="836" height="213.33333333333334" rx="12" fill="#e2ebe7"/><text x="55" y="152.0" font-size="28" fill="#177e89">桌面节奏</text><text x="55" y="191.0" font-size="24" fill="#23343b">数1、2、3、4 → 每拍一下 → 保留数拍只敲1、3</text><text x="55" y="223.0" font-size="24" fill="#23343b">再试后半拍；速度先保持不变。</text><rect x="32" y="345.33333333333337" width="836" height="213.33333333333334" rx="12" fill="#e2ebe7"/><text x="55" y="385.33333333333337" font-size="28" fill="#177e89">键盘三音</text><text x="55" y="424.33333333333337" font-size="24" fill="#23343b">两个黑键左侧白键C → 右邻D → 再右邻E</text><text x="55" y="456.33333333333337" font-size="24" fill="#23343b">C—D—E—E—D—C → 休止两拍，共八拍。</text><rect x="32" y="578.6666666666667" width="836" height="213.33333333333334" rx="12" fill="#e2ebe7"/><text x="55" y="618.6666666666667" font-size="28" fill="#177e89">C调高音竖笛</text><text x="55" y="657.6666666666667" font-size="24" fill="#23343b">B：闭0、1；A：闭0、1、2；G：闭0、1、2、3</text><text x="55" y="689.6666666666667" font-size="24" fill="#23343b">0为背孔；1起为正面自上而下。其余孔开放。</text><text x="40" y="852" font-size="22" fill="#23343b">原创教学示意 · 非实测数据 · 按图注理解适用范围</text></g></svg>