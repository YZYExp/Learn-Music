<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780"><rect width="900" height="780" fill="#faf7ef"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#23343b"><text x="40" y="62" font-size="34" fill="#23343b">分类时，先写下你在问什么</text><text x="40" y="170" font-size="25" fill="#177e89">乐器</text><text x="265" y="170" font-size="25" fill="#177e89">主要声源</text><text x="485" y="170" font-size="25" fill="#177e89">操作接口</text><text x="695" y="170" font-size="25" fill="#177e89">常见分组</text><path d="M40 273L855 273" stroke="#d2dad5" stroke-width="2" fill="none"/><text x="40" y="245" font-size="23" fill="#23343b">钢琴</text><text x="265" y="245" font-size="23" fill="#23343b">琴弦</text><text x="485" y="245" font-size="23" fill="#23343b">键盘／击弦</text><text x="695" y="245" font-size="23" fill="#23343b">键盘</text><path d="M40 358L855 358" stroke="#d2dad5" stroke-width="2" fill="none"/><text x="40" y="330" font-size="23" fill="#23343b">长笛</text><text x="265" y="330" font-size="23" fill="#23343b">空气振动</text><text x="485" y="330" font-size="23" fill="#23343b">吹奏／按键</text><text x="695" y="330" font-size="23" fill="#23343b">木管</text><path d="M40 443L855 443" stroke="#d2dad5" stroke-width="2" fill="none"/><text x="40" y="415" font-size="23" fill="#23343b">手风琴</text><text x="265" y="415" font-size="23" fill="#23343b">自由簧与气流</text><text x="485" y="415" font-size="23" fill="#23343b">键／钮／风箱</text><text x="695" y="415" font-size="23" fill="#23343b">依编制而定</text><path d="M40 528L855 528" stroke="#d2dad5" stroke-width="2" fill="none"/><text x="40" y="500" font-size="23" fill="#23343b">电吉他</text><text x="265" y="500" font-size="23" fill="#23343b">振动琴弦</text><text x="485" y="500" font-size="23" fill="#23343b">按弦／拨弦</text><text x="695" y="500" font-size="23" fill="#23343b">节奏组等</text><path d="M40 613L855 613" stroke="#d2dad5" stroke-width="2" fill="none"/><text x="40" y="585" font-size="23" fill="#23343b">合成器</text><text x="265" y="585" font-size="23" fill="#23343b">电子信号</text><text x="485" y="585" font-size="23" fill="#23343b">键／旋钮等</text><text x="695" y="585" font-size="23" fill="#23343b">依编制而定</text><text x="40" y="710" font-size="24" fill="#23343b">同一乐器可有多个合理标签；标签来自不同维度。</text><text x="40" y="752" font-size="22" fill="#23343b">原创教学示意 · 非实测数据 · 按图注理解适用范围</text></g></svg>