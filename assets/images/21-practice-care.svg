<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850"><rect width="900" height="850" fill="#faf7ef"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#23343b"><text x="40" y="62" font-size="34" fill="#23343b">先让选择变得可以试验</text><rect x="32" y="112.0" width="836" height="147.5" rx="12" fill="#e2ebe7"/><text x="55" y="152.0" font-size="28" fill="#177e89">希望发什么声音</text><text x="55" y="191.0" font-size="24" fill="#23343b">写三首喜欢的曲子，确认旋律、伴奏或节奏目标。</text><rect x="32" y="279.5" width="836" height="147.5" rx="12" fill="#e2ebe7"/><text x="55" y="319.5" font-size="28" fill="#177e89">现实能怎样练</text><text x="55" y="358.5" font-size="24" fill="#23343b">试场地、时段、搬运、耳机和机械噪声。</text><rect x="32" y="447.0" width="836" height="147.5" rx="12" fill="#e2ebe7"/><text x="55" y="487.0" font-size="28" fill="#177e89">请熟悉器种的人检查</text><text x="55" y="526.0" font-size="24" fill="#23343b">区分乐器状态、使用不适与初学动作问题。</text><rect x="32" y="614.5" width="836" height="147.5" rx="12" fill="#e2ebe7"/><text x="55" y="654.5" font-size="28" fill="#177e89">留下一个短练习</text><text x="55" y="693.5" font-size="24" fill="#23343b">录一次 → 听一次 → 只改一项 → 放回短句。</text><text x="40" y="822" font-size="22" fill="#23343b">原创教学示意 · 非实测数据 · 按图注理解适用范围</text></g></svg>