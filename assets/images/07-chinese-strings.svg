<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860" role="img" aria-label="琴、筝、扬琴：手怎样作用于弦"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#177e89"/></marker></defs><rect width="900" height="860" fill="#faf7ef"/><text x="40" y="53" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34">琴、筝、扬琴：手怎样作用于弦</text><text x="40" y="92" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23">弦鸣是发声分类；拨与击是激励方式</text><rect x="28" y="125" width="844" height="190" rx="8" fill="#f0ebe1" stroke="none"/><rect x="28" y="340" width="844" height="190" rx="8" fill="#f0ebe1" stroke="none"/><rect x="28" y="555" width="844" height="190" rx="8" fill="#f0ebe1" stroke="none"/><text x="48" y="162" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28">古琴：按在琴面，改变弦长</text><rect x="92" y="227" width="660" height="28" rx="8" fill="#23343b" stroke="none"/><path d="M325 184L336 184L336 223Q329 231 323 222Z" stroke="#ba6138" stroke-width="3" fill="#efd2c1" /><path d="M95 207L323 223" stroke="#177e89" stroke-width="4" fill="none" /><path d="M334 223L742 207" stroke="#177e89" stroke-width="4" fill="none" /><circle cx="658" cy="207" r="7" fill="#ba6138"/><text x="550" y="195" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">拨弦</text><text x="93" y="292" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">左手在弦上按实；徽是位置标记，不是品</text><text x="48" y="377" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28">古筝：琴码两侧，分别拨与按</text><rect x="92" y="450" width="660" height="26" rx="8" fill="#23343b" stroke="none"/><path d="M420 452L440 413L460 452Z" stroke="#ba6138" stroke-width="3" fill="#e7ddd0" /><path d="M225 395L240 395L240 440Q230 450 221 440Z" stroke="#ba6138" stroke-width="3" fill="#efd2c1" /><path d="M95 426L229 442" stroke="#177e89" stroke-width="4" fill="none" /><path d="M229 442L440 413" stroke="#177e89" stroke-width="4" fill="none" /><path d="M440 413L742 426" stroke="#177e89" stroke-width="4" fill="none" /><circle cx="658" cy="424" r="7" fill="#ba6138"/><text x="555" y="407" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">拨弦侧</text><text x="93" y="507" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">码另一侧按压改变张力，影响发声段音高</text><text x="48" y="592" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28">扬琴：琴竹敲击已调音的弦段</text><rect x="92" y="665" width="660" height="26" rx="8" fill="#23343b" stroke="none"/><path d="M95 650L440 630L742 650" stroke="#177e89" stroke-width="3" fill="none" /><path d="M420 665L440 630L460 665Z" stroke="#ba6138" stroke-width="3" fill="#e7ddd0" /><path d="M625 604L571 637" stroke="#ba6138" stroke-width="7" fill="none" /><circle cx="571" cy="637" r="7" fill="#ba6138"/><text x="660" y="615" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">击弦</text><text x="93" y="722" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">敲的是弦；分类仍为弦鸣乐器</text><text x="40" y="832" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22">原创简化示意 · 不按比例 · 弦数按教学需要省略</text></svg>