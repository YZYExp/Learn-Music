<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#177e89"/></marker></defs><rect width="900" height="900" fill="#faf7ef"/><g fill="#23343b" font-family="Noto Sans CJK SC, sans-serif"><text x="42" y="62" font-size="34" font-weight="bold">同一号嘴，怎样获得不同音高</text><text x="42" y="104" font-size="23">嘴唇振动与管内共鸣耦合；这里仅画管路关系</text><rect x="30" y="135" width="840" height="205" rx="16" fill="#ffffff" stroke="#d7ded7"/><text x="52" y="175" font-size="25" fill="#23343b">01  管长固定：改变嘴唇与气息配合</text><path d="M80 225 L650 225 L745 205 L745 270 L650 250 L80 250" fill="none" stroke="#23343b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="80" y="306" font-size="23" fill="#23343b">同一管路可以选择不同共鸣位置</text><rect x="30" y="360" width="840" height="215" rx="16" fill="#ffffff" stroke="#d7ded7"/><text x="52" y="402" font-size="25" fill="#23343b">02  阀切换通路：加入附加管，音高通常降低</text><path d="M80 452 L285 452 L285 520 L475 520 L475 452 L650 452 L745 432 L745 497 L650 477 L500 477" fill="none" stroke="#23343b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M285 452 L285 520 L475 520 L475 452" fill="none" stroke="#177e89" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><text x="535" y="548" font-size="22" fill="#177e89">青绿：附加路段</text><rect x="30" y="595" width="840" height="230" rx="16" fill="#ffffff" stroke="#d7ded7"/><text x="52" y="637" font-size="25" fill="#23343b">03  滑管伸出：同一共鸣分支的音高降低</text><path d="M80 680 L410 680 Q445 680 445 715 Q445 750 410 750 L80 750" fill="none" stroke="#23343b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M80 680 L650 680 Q685 680 685 715 Q685 750 650 750 L80 750" fill="none" stroke="#177e89" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M470 715L630 715" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><text x="80" y="795" font-size="22" fill="#23343b">外滑管移动会同时延长去、回两段路径</text><text x="42" y="868" font-size="22" fill="#23343b">原创简化示意 · 省略细节，不按实物比例</text></g></svg>