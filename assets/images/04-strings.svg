<svg xmlns="http://www.w3.org/2000/svg" width="900" height="890" viewBox="0 0 900 890"><rect width="900" height="890" fill="#faf7ef"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#23343b"><text x="40" y="62" font-size="34" fill="#23343b">理想细弦：固定其余量再比较</text><text x="40" y="125" font-size="27" fill="#177e89">基准</text><text x="40" y="163" font-size="24" fill="#23343b">长度L，张力T，线密度μ</text><path d="M95 212L565 212" stroke="#177e89" stroke-width="5" fill="none"/><circle cx="95" cy="212" r="7" fill="#23343b"/><circle cx="565" cy="212" r="7" fill="#23343b"/><text x="650" y="215" font-size="27" fill="#ba6138">基频 f</text><text x="40" y="295" font-size="27" fill="#177e89">长度减半</text><text x="40" y="333" font-size="24" fill="#23343b">张力、线密度不变</text><path d="M95 382L330.0 382" stroke="#177e89" stroke-width="5" fill="none"/><circle cx="95" cy="382" r="7" fill="#23343b"/><circle cx="330.0" cy="382" r="7" fill="#23343b"/><text x="650" y="385" font-size="27" fill="#ba6138">基频 2f</text><text x="40" y="465" font-size="27" fill="#177e89">张力变为四倍</text><text x="40" y="503" font-size="24" fill="#23343b">长度、线密度不变</text><path d="M95 552L565 552" stroke="#177e89" stroke-width="5" fill="none"/><circle cx="95" cy="552" r="7" fill="#23343b"/><circle cx="565" cy="552" r="7" fill="#23343b"/><text x="650" y="555" font-size="27" fill="#ba6138">基频 2f</text><text x="40" y="635" font-size="27" fill="#177e89">线密度变为四倍</text><text x="40" y="673" font-size="24" fill="#23343b">长度、张力不变</text><path d="M95 722L565 722" stroke="#177e89" stroke-width="10" fill="none"/><circle cx="95" cy="722" r="7" fill="#23343b"/><circle cx="565" cy="722" r="7" fill="#23343b"/><text x="650" y="725" font-size="27" fill="#ba6138">基频 f/2</text><text x="40" y="825" font-size="23" fill="#23343b">仅为模型比较；不要对实际乐器随意增加张力。</text><text x="40" y="862" font-size="22" fill="#23343b">原创教学示意 · 非实测数据 · 按图注理解适用范围</text></g></svg>