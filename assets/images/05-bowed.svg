<svg xmlns="http://www.w3.org/2000/svg" width="900" height="840" viewBox="0 0 900 840" role="img" aria-label="弓、手指与琴体：两种拉弦结构"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#177e89"/></marker></defs><rect width="900" height="840" fill="#faf7ef"/><text x="40" y="53" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34">弓、手指与琴体：两种拉弦结构</text><text x="40" y="92" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23">先看弦如何被按，再看振动从哪里传出去</text><rect x="28" y="120" width="844" height="290" rx="8" fill="#f0ebe1" stroke="none"/><text x="48" y="158" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28">小提琴：弦被按向指板</text><path d="M100 285L420 285L450 310L100 310Z" stroke="#23343b" stroke-width="3" fill="#23343b" /><path d="M420 340Q590 300 765 345L765 369L420 369Z" stroke="#23343b" stroke-width="3" fill="#e7ddd0" /><path d="M100 247L270 247" stroke="#177e89" stroke-width="4" fill="none" /><path d="M270 247L315 282" stroke="#177e89" stroke-width="4" fill="none" /><path d="M315 282L625 247" stroke="#177e89" stroke-width="4" fill="none" /><path d="M625 247L740 271" stroke="#177e89" stroke-width="4" fill="none" /><path d="M605 328L625 247L645 328Z" stroke="#ba6138" stroke-width="3" fill="#e7ddd0" /><path d="M303 200Q325 195 326 215L325 274Q319 287 309 274L301 218Z" stroke="#ba6138" stroke-width="3" fill="#efd2c1" /><path d="M315 200L315 224" stroke="#ba6138" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="100" y="343" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">指板</text><text x="535" y="217" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">琴桥</text><path d="M592 223L619 242" stroke="#23343b" stroke-width="2" fill="none" /><path d="M638 293L682 338" stroke="#177e89" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="682" y="333" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">面板</text><text x="48" y="393" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">手指落点决定弦长；弓持续补充能量</text><rect x="28" y="430" width="844" height="335" rx="8" fill="#f0ebe1" stroke="none"/><text x="48" y="471" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28">二胡：手指触弦，后方没有指板</text><rect x="123" y="500" width="20" height="150" rx="1" fill="#23343b" stroke="none"/><path d="M125 650L205 650L222 689L205 726L125 726L107 689Z" stroke="#23343b" stroke-width="3" fill="#e7ddd0" /><path d="M165 498L165 704" stroke="#177e89" stroke-width="3" fill="none" /><path d="M182 498L182 704" stroke="#177e89" stroke-width="3" fill="none" /><path d="M158 692L175 676L192 692" stroke="#ba6138" stroke-width="4" fill="none" /><path d="M236 534Q206 524 180 554" stroke="#ba6138" stroke-width="10" fill="none" /><text x="270" y="544" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">按弦改变有效弦长</text><path d="M270 554L189 554" stroke="#23343b" stroke-width="2" fill="none" /><path d="M90 611L310 611" stroke="#ba6138" stroke-width="4" fill="none" /><text x="335" y="615" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">弓毛穿在两弦之间</text><path d="M177 692L249 700" stroke="#177e89" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="270" y="707" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">琴码 → 蒙皮 → 空气</text><text x="48" y="749" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">两弦之间的弓毛可分别作用于内弦、外弦</text><text x="40" y="812" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22">原创简化示意 · 不按比例 · 弦数按教学需要省略</text></svg>