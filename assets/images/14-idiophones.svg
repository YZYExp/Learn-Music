<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#177e89"/></marker></defs><rect width="900" height="860" fill="#faf7ef"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="42" y="58" font-size="32" fill="#23343b" font-weight="bold">振动体怎样被支承？</text><rect x="28" y="95" width="844" height="218" rx="12" fill="#f0ede4" stroke="none" stroke-width="3"/><rect x="28" y="335" width="844" height="218" rx="12" fill="#f0ede4" stroke="none" stroke-width="3"/><rect x="28" y="575" width="844" height="218" rx="12" fill="#f0ede4" stroke="none" stroke-width="3"/><text x="50" y="132" font-size="26" fill="#177e89" font-weight="bold">① 马林巴：音条振动，共鸣管辅助辐射</text><rect x="100" y="177" width="280" height="24" rx="3" fill="#ba6138" stroke="#23343b" stroke-width="3"/><circle cx="162" cy="210" r="8" fill="#23343b"/><circle cx="318" cy="210" r="8" fill="#23343b"/><path d="M215 228 L215 292 L270 292 L270 228" stroke="#177e89" stroke-width="5" fill="none"/><path d="M242,206 L242,248" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><text x="425" y="187" font-size="24" fill="#23343b" font-weight="normal">音条：主要振动体</text><text x="425" y="230" font-size="22" fill="#23343b" font-weight="normal">两处支承靠近选定振动的节点</text><text x="425" y="273" font-size="24" fill="#23343b" font-weight="normal">下方空气柱响应相应频率</text><text x="50" y="372" font-size="26" fill="#177e89" font-weight="bold">② 颤音琴：挡片改变共鸣条件</text><rect x="100" y="414" width="280" height="20" rx="2" fill="#9cabb1" stroke="#23343b" stroke-width="3"/><path d="M215 462 L215 526 L270 526 L270 462" stroke="#177e89" stroke-width="5" fill="none"/><line x1="214" y1="462" x2="271" y2="462" stroke="#ba6138" stroke-width="7" stroke-dasharray=""/><path d="M280 444 Q320 456 285 481" stroke="#ba6138" stroke-width="3" fill="none"/><text x="425" y="429" font-size="24" fill="#23343b" font-weight="normal">金属音条：尾音较长</text><text x="425" y="472" font-size="22" fill="#23343b" font-weight="normal">管口挡片旋转，声音周期起伏</text><text x="425" y="515" font-size="24" fill="#23343b" font-weight="normal">踏板制音另有机制</text><text x="50" y="612" font-size="26" fill="#177e89" font-weight="bold">③ 姆比拉：一端固定，伸出部分被拨响</text><rect x="100" y="654" width="280" height="116" rx="3" fill="#ddc9ac" stroke="#23343b" stroke-width="3"/><rect x="120" y="668" width="240" height="16" rx="0" fill="#23343b" stroke="none" stroke-width="3"/><rect x="143" y="660" width="15" height="58" rx="2" fill="#9cabb1" stroke="#23343b" stroke-width="3"/><rect x="188" y="660" width="15" height="70" rx="2" fill="#9cabb1" stroke="#23343b" stroke-width="3"/><rect x="233" y="660" width="15" height="85" rx="2" fill="#9cabb1" stroke="#23343b" stroke-width="3"/><rect x="278" y="660" width="15" height="64" rx="2" fill="#9cabb1" stroke="#23343b" stroke-width="3"/><rect x="323" y="660" width="15" height="48" rx="2" fill="#9cabb1" stroke="#23343b" stroke-width="3"/><path d="M212,767 L212,746" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><text x="425" y="686" font-size="24" fill="#23343b" font-weight="normal">簧片有效长度参与决定音高</text><text x="425" y="730" font-size="24" fill="#23343b" font-weight="normal">木板及共鸣体影响声音辐射</text><text x="425" y="772" font-size="24" fill="#23343b" font-weight="normal">拨奏仍然可以属于体鸣</text><text x="42" y="835" font-size="22" fill="#65757b" font-weight="normal">原创教学示意 · 非制造图 · 尺寸与动作均作简化</text></g></svg>