<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#177e89"/></marker></defs><rect width="900" height="900" fill="#faf7ef"/><g fill="#23343b" font-family="Noto Sans CJK SC, sans-serif"><text x="42" y="62" font-size="34" font-weight="bold">簧片与管腔共同工作</text><text x="42" y="104" font-size="23">簧片调节气流；管内声场反馈到簧片</text><rect x="30" y="135" width="840" height="220" rx="16" fill="#ffffff" stroke="#d7ded7"/><text x="52" y="175" font-size="25" fill="#23343b">01  单簧：一片簧片与笛头形成开口</text><path d="M185 260 L340 215 L480 215 L480 285 L185 285 Z" fill="none" stroke="#23343b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M185 280 Q275 270 365 280 L480 280" fill="none" stroke="#ba6138" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M75 270L174 270" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><text x="60" y="320" font-size="22" fill="#177e89">供气</text><text x="535" y="240" font-size="23" fill="#ba6138">簧片</text><path d="M525 245L380 277" fill="none" stroke="#ba6138" stroke-width="3" /><text x="535" y="295" font-size="23" fill="#23343b">单簧管、萨克斯</text><rect x="30" y="375" width="840" height="205" rx="16" fill="#ffffff" stroke="#d7ded7"/><text x="52" y="417" font-size="25" fill="#23343b">02  双簧：两片簧瓣之间留有开口</text><path d="M185 470 Q280 430 400 455 L480 455 M185 485 Q280 525 400 500 L480 500" fill="none" stroke="#ba6138" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M75 478L180 478" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><text x="535" y="475" font-size="23" fill="#23343b">双簧管、巴松</text><text x="535" y="520" font-size="23" fill="#23343b">唢呐等</text><rect x="30" y="600" width="840" height="225" rx="16" fill="#ffffff" stroke="#d7ded7"/><text x="52" y="642" font-size="25" fill="#23343b">03  管腔也决定共鸣与音区转换</text><path d="M65 682 L390 682 M65 715 L390 715" fill="none" stroke="#23343b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="450" y="708" font-size="23" fill="#23343b">近似圆柱：单簧管</text><path d="M65 762 L390 740 M65 775 L390 802" fill="none" stroke="#23343b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="450" y="782" font-size="23" fill="#23343b">近似圆锥：萨克斯等</text><text x="42" y="868" font-size="22" fill="#23343b">原创简化示意 · 省略细节，不按实物比例</text></g></svg>