77,398 L606,398" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><text x="45" y="545" font-size="27" fill="#177e89" font-weight="bold">MIDI 控制</text><rect x="45" y="575" width="240" height="75" rx="12" fill="#e3eeea" stroke="none" stroke-width="3"/><text x="63" y="622" font-size="25" fill="#23343b" font-weight="normal">按键等动作</text><rect x="330" y="575" width="240" height="75" rx="12" fill="#e3eeea" stroke="none" stroke-width="3"/><text x="348" y="622" font-size="25" fill="#23343b" font-weight="normal">MIDI 信息</text><rect x="615" y="575" width="240" height="75" rx="12" fill="#e3eeea" stroke="none" stroke-width="3"/><text x="633" y="622" font-size="25" fill="#23343b" font-weight="normal">接收端声源</text><path d="M292,613 L321,613" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><path d="M577,613 L606,613" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><text x="45" y="276" font-size="24" fill="#23343b" font-weight="normal">用电控制风路，不等于采用电子声源。</text><text x="45" y="491" font-size="24" fill="#23343b" font-weight="normal">数字声源可采用采样、建模等方法。</text><text x="45" y="706" font-size="24" fill="#23343b" font-weight="normal">MIDI 演奏信息不是音频；接收端仍需生成声音。</text><text x="42" y="775" font-size="22" fill="#65757b" font-weight="normal">原创教学示意 · 非制造图 · 尺寸与动作均作简化</text></g></svg>