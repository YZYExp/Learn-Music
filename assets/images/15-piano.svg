<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#177e89"/></marker></defs><rect width="900" height="900" fill="#faf7ef"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="42" y="58" font-size="32" fill="#23343b" font-weight="bold">钢琴：击弦后为何要离开？</text><rect x="28" y="100" width="844" height="159" rx="12" fill="#f0ede4" stroke="none" stroke-width="3"/><text x="50" y="135" font-size="25" fill="#177e89" font-weight="bold">① 按键</text><text x="388" y="151" font-size="22" fill="#23343b" font-weight="normal">琴键通过杠杆使琴槌加速</text><line x1="90" y1="164" x2="345" y2="164" stroke="#177e89" stroke-width="4" stroke-dasharray=""/><line x1="225" y1="225" x2="150" y2="247" stroke="#23343b" stroke-width="7" stroke-dasharray=""/><rect x="213" y="213" width="50" height="22" rx="5" fill="#ba6138" stroke="#23343b" stroke-width="3"/><rect x="288" y="150" width="35" height="14" rx="3" fill="#23343b" stroke="none" stroke-width="3"/><path d="M245,210 L245,185" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><rect x="28" y="277" width="844" height="159" rx="12" fill="#f0ede4" stroke="none" stroke-width="3"/><text x="50" y="312" font-size="25" fill="#177e89" font-weight="bold">② 脱进与击弦</text><text x="388" y="328" font-size="22" fill="#23343b" font-weight="normal">推动关系解除，琴槌短暂接触弦</text><line x1="90" y1="341" x2="345" y2="341" stroke="#177e89" stroke-width="4" stroke-dasharray=""/><line x1="225" y1="357" x2="150" y2="424" stroke="#23343b" stroke-width="7" stroke-dasharray=""/><rect x="213" y="345" width="50" height="22" rx="5" fill="#ba6138" stroke="#23343b" stroke-width="3"/><rect x="288" y="309" width="35" height="14" rx="3" fill="#23343b" stroke="none" stroke-width="3"/><path d="M264,366 L264,346" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><rect x="28" y="454" width="844" height="159" rx="12" fill="#f0ede4" stroke="none" stroke-width="3"/><text x="50" y="489" font-size="25" fill="#177e89" font-weight="bold">③ 保持与衰减</text><text x="388" y="505" font-size="22" fill="#23343b" font-weight="normal">琴槌离弦；止音器仍保持抬起</text><line x1="90" y1="518" x2="345" y2="518" stroke="#177e89" stroke-width="4" stroke-dasharray=""/><line x1="225" y1="576" x2="150" y2="601" stroke="#23343b" stroke-width="7" stroke-dasharray=""/><rect x="213" y="564" width="50" height="22" rx="5" fill="#ba6138" stroke="#23343b" stroke-width="3"/><rect x="288" y="486" width="35" height="14" rx="3" fill="#23343b" stroke="none" stroke-width="3"/><path d="M90 518 Q150 503 215 518 Q280 533 345 518" stroke="#ba6138" stroke-width="3" fill="none"/><text x="388" y="556" font-size="22" fill="#23343b" font-weight="normal">声音由弦—琴桥—音板传出</text><rect x="28" y="631" width="844" height="159" rx="12" fill="#f0ede4" stroke="none" stroke-width="3"/><text x="50" y="666" font-size="25" fill="#177e89" font-weight="bold">④ 松键与止音</text><text x="388" y="682" font-size="22" fill="#23343b" font-weight="normal">止音器回落，吸收弦的振动</text><line x1="90" y1="695" x2="345" y2="695" stroke="#177e89" stroke-width="4" stroke-dasharray=""/><line x1="225" y1="753" x2="150" y2="778" stroke="#23343b" stroke-width="7" stroke-dasharray=""/><rect x="213" y="741" width="50" height="22" rx="5" fill="#ba6138" stroke="#23343b" stroke-width="3"/><rect x="288" y="681" width="35" height="14" rx="3" fill="#23343b" stroke="none" stroke-width="3"/><path d="M305,659 L305,680" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><text x="388" y="733" font-size="22" fill="#23343b" font-weight="normal">右踏板可使相应止音器保持抬起</text><text x="45" y="824" font-size="22" fill="#23343b" font-weight="normal">青线：琴弦　赭色块：琴槌　深色小块：止音器</text><text x="42" y="875" font-size="22" fill="#65757b" font-weight="normal">原创教学示意 · 非制造图 · 尺寸与动作均作简化</text></g></svg>