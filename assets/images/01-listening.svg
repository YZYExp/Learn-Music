<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850"><rect width="900" height="850" fill="#faf7ef"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#23343b"><text x="40" y="62" font-size="34" fill="#23343b">听一声：把观察分成四次</text><rect x="32" y="112.0" width="836" height="147.5" rx="12" fill="#e2ebe7"/><text x="55" y="152.0" font-size="28" fill="#177e89">01 起音</text><text x="55" y="191.0" font-size="24" fill="#23343b">声音怎样出现：清楚撞击、柔和进入、气声？</text><rect x="32" y="279.5" width="836" height="147.5" rx="12" fill="#e2ebe7"/><text x="55" y="319.5" font-size="28" fill="#177e89">02 延续</text><text x="55" y="358.5" font-size="24" fill="#23343b">能量继续输入吗？音高与响度有没有变化？</text><rect x="32" y="447.0" width="836" height="147.5" rx="12" fill="#e2ebe7"/><text x="55" y="487.0" font-size="28" fill="#177e89">03 收尾</text><text x="55" y="526.0" font-size="24" fill="#23343b">自行衰减、主动止音，还是房间仍在回响？</text><rect x="32" y="614.5" width="836" height="147.5" rx="12" fill="#e2ebe7"/><text x="55" y="654.5" font-size="28" fill="#177e89">04 角色</text><text x="55" y="693.5" font-size="24" fill="#23343b">在这个片段里：旋律、低音、和声或节奏？</text><text x="40" y="822" font-size="22" fill="#23343b">原创教学示意 · 非实测数据 · 按图注理解适用范围</text></g></svg>