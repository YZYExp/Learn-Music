<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#177e89"/></marker></defs><rect width="900" height="860" fill="#faf7ef"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="42" y="58" font-size="32" fill="#23343b" font-weight="bold">鼓声从哪里来？</text><rect x="28" y="95" width="844" height="218" rx="12" fill="#f0ede4" stroke="none" stroke-width="3"/><rect x="28" y="335" width="844" height="218" rx="12" fill="#f0ede4" stroke="none" stroke-width="3"/><rect x="28" y="575" width="844" height="218" rx="12" fill="#f0ede4" stroke="none" stroke-width="3"/><text x="50" y="132" font-size="26" fill="#177e89" font-weight="bold">① 普通鼓：膜与空气共同响应</text><path d="M95 195 L95 275 Q225 305 355 275 L355 195" stroke="#23343b" stroke-width="4" fill="#ddc9ac"/><line x1="95" y1="195" x2="355" y2="195" stroke="#ba6138" stroke-width="6" stroke-dasharray=""/><path d="M95 195 Q160 165 225 195 Q290 225 355 195" stroke="#177e89" stroke-width="3" fill="none"/><path d="M225,144 L225,180" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><text x="405" y="195" font-size="24" fill="#23343b" font-weight="normal">鼓槌输入能量</text><text x="405" y="236" font-size="24" fill="#23343b" font-weight="normal">张力、质量、尺寸影响振动</text><text x="405" y="277" font-size="22" fill="#23343b" font-weight="normal">曲线仅示意某一振动时刻</text><text x="50" y="372" font-size="26" fill="#177e89" font-weight="bold">② 定音鼓：踏板改变鼓皮张力</text><path d="M100 430 Q100 550 225 550 Q350 550 350 430" stroke="#23343b" stroke-width="4" fill="#ddc9ac"/><line x1="100" y1="430" x2="350" y2="430" stroke="#ba6138" stroke-width="6" stroke-dasharray=""/><line x1="225" y1="550" x2="225" y2="565" stroke="#23343b" stroke-width="3" stroke-dasharray=""/><line x1="225" y1="565" x2="320" y2="565" stroke="#23343b" stroke-width="6" stroke-dasharray=""/><path d="M320,485 L320,545" fill="none" stroke