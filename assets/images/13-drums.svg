343b" font-weight="normal">下鼓皮附近的响弦参与振动</text><text x="405" y="764" font-size="24" fill="#23343b" font-weight="normal">关闭响弦后，声音明显改变</text><text x="42" y="835" font-size="22" fill="#65757b" font-weight="normal">原创教学示意 · 非制造图 · 尺寸与动作均作简化</text></g></svg>