<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850"><rect width="900" height="850" fill="#faf7ef"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#23343b"><text x="40" y="62" font-size="34" fill="#23343b">听辨对照：每次只改一个关系</text><rect x="32" y="112.0" width="836" height="147.5" rx="12" fill="#e2ebe7"/><text x="55" y="152.0" font-size="28" fill="#177e89">01 谐波组成</text><text x="55" y="191.0" font-size="24" fill="#23343b">相同：220 Hz、持续包络；改变：谐波数量</text><rect x="32" y="279.5" width="836" height="147.5" rx="12" fill="#e2ebe7"/><text x="55" y="319.5" font-size="28" fill="#177e89">02 时间包络</text><text x="55" y="358.5" font-size="24" fill="#23343b">相同：220 Hz、6个谐波；改变：起音与延续</text><rect x="32" y="447.0" width="836" height="147.5" rx="12" fill="#e2ebe7"/><text x="55" y="487.0" font-size="28" fill="#177e89">03 接近的频率</text><text x="55" y="526.0" font-size="24" fill="#23343b">220＋222 Hz，对照220＋220.5 Hz</text><rect x="32" y="614.5" width="836" height="147.5" rx="12" fill="#e2ebe7"/><text x="55" y="654.5" font-size="28" fill="#177e89">04 重音分组</text><text x="55" y="693.5" font-size="24" fill="#23343b">相同：12次等间隔短音；改变：每2声／每3声一组</text><text x="40" y="822" font-size="22" fill="#23343b">原创教学示意 · 非实测数据 · 按图注理解适用范围</text></g></svg>