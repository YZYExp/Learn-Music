<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#177e89"/></marker></defs><rect width="900" height="900" fill="#faf7ef"/><g fill="#23343b" font-family="Noto Sans CJK SC, sans-serif"><text x="42" y="62" font-size="34" font-weight="bold">自由簧：相似元件，不同乐器</text><text x="42" y="104" font-size="23">先辨认簧片，再比较供气和选音方式</text><rect x="30" y="135" width="840" height="205" rx="16" fill="#ffffff" stroke="#d7ded7"/><text x="52" y="175" font-size="25" fill="#23343b">01  局部放大：簧舌在框口中往复运动</text><rect x="90" y="210" width="330" height="75" rx="5" fill="#d7ded7" stroke="#23343b" stroke-width="4"/><rect x="115" y="230" width="280" height="32" fill="#ffffff"/><path d="M117 246 L360 246" fill="none" stroke="#ba6138" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><path d="M117 246 Q240 246 360 215" fill="none" stroke="#ba6138" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M117 246 Q240 246 360 277" fill="none" stroke="#ba6138" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="485" y="230" font-size="23" fill="#23343b">左端固定，右端可振动</text><text x="485" y="275" font-size="22" fill="#23343b">细线表示不同振动位置</text><rect x="30" y="360" width="840" height="140" rx="16" fill="#ffffff" stroke="#d7ded7"/><text x="52" y="401" font-size="27" fill="#23343b">笙</text><text x="220" y="401" font-size="24" fill="#23343b">吹／吸 → 共同气斗 → 簧与管</text><text x="220" y="453" font-size="22" fill="#23343b">按孔选择发声管，可同时发出多个音</text><rect x="30" y="520" width="840" height="140" rx="16" fill="#ffffff" stroke="#d7ded7"/><text x="52" y="561" font-size="27" fill="#23343b">口琴</text><text x="220" y="561" font-size="24" fill="#23343b">吹／吸 → 孔道 → 相应簧片</text><text x="220" y="613" font-size="22" fill="#23343b">孔位、吹吸与型号决定可用的音</text><rect x="30" y="680" width="840" height="140" rx="16" fill="#ffffff" stroke="#d7ded7"/><text x="52" y="721" font-size="27" fill="#23343b">手风琴</text><text x="220" y="721" font-size="24" fill="#23343b">风箱 → 气阀 → 选定簧片组</text><text x="220" y="773" font-size="22" fill="#23343b">键或钮选音，风箱持续塑造强弱</text><text x="42" y="868" font-size="22" fill="#23343b">原创简化示意 · 省略细节，不按实物比例</text></g></svg>