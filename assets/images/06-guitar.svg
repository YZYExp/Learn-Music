<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" role="img" aria-label="拨动同样的弦，两条传声路径"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#177e89"/></marker></defs><rect width="900" height="820" fill="#faf7ef"/><text x="40" y="53" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34">拨动同样的弦，两条传声路径</text><text x="40" y="92" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23">电吉他的最终声音还受到效果处理与音箱影响</text><rect x="28" y="121" width="844" height="270" rx="8" fill="#f0ebe1" stroke="none"/><text x="48" y="160" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28">原声吉他：把振动传给面板</text><path d="M90 220L390 220" stroke="#177e89" stroke-width="4" fill="none" /><path d="M95 263Q250 232 405 263L405 291L95 291Z" stroke="#23343b" stroke-width="3" fill="#e7ddd0" /><path d="M325 255L335 220L345 255Z" stroke="#ba6138" stroke-width="3" fill="#e7ddd0" /><text x="72" y="206" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">弦</text><text x="118" y="331" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">琴桥带动面板</text><path d="M335 232L335 263" stroke="#177e89" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M438 250L514 250" stroke="#177e89" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M550 215Q580 250 550 285" stroke="#177e89" stroke-width="3" fill="none" /><path d="M579 215Q609 250 579 285" stroke="#177e89" stroke-width="3" fill="none" /><path d="M608 215Q638 250 608 285" stroke="#177e89" stroke-width="3" fill="none" /><text x="662" y="247" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26">推动空气</text><text x="662" y="282" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26">形成声音</text><text x="48" y="373" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">琴体及空气共同响应；不是只靠音孔“出声”</text><rect x="28" y="411" width="844" height="328" rx="8" fill="#f0ebe1" stroke="none"/><text x="48" y="452" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28">磁性拾音电吉他：先转换成电信号</text><path d="M85 510L340 510" stroke="#177e89" stroke-width="4" fill="none" /><rect x="205" y="531" width="90" height="26" rx="8" fill="#ba6138" stroke="none"/><path d="M195 545Q180 568 199 581L302 581Q320 568 305 545" stroke="#23343b" stroke-width="4" fill="none" /><text x="68" y="501" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">钢弦</text><text x="70" y="627" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">磁体＋线圈</text><path d="M310 558L405 558" stroke="#177e89" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="427" y="520" width="155" height="77" rx="8" fill="#dbe9e5" stroke="none"/><text x="442" y="568" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">效果／放大</text><path d="M601 558L662 558" stroke="#177e89" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="683" y="510" width="137" height="100" rx="8" fill="#23343b" stroke="none"/><circle cx="751" cy="560" r="34" fill="#e7ddd0"/><text x="711" y="653" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">扬声器</text><text x="48" y="712" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24">磁性拾音器感应钢弦运动，不等同于空气麦克风</text><text x="40" y="792" fill="#23343b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22">原创简化示意 · 不按比例 · 弦数按教学需要省略</text></svg>