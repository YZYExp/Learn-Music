name: Publish homepage and reading site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Install website dependency
        run: python -m pip install --only-binary=:all: -r site/requirements.txt
      - name: Validate book sources
        run: python scripts/check_book.py
      - name: Build homepage and chapter pages
        run: python scripts/build_site.py --base-path "/${GITHUB_REPOSITORY#*/}/"
      - name: Check browser script
        run: node --check site/app.js
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site
      - name: Preserve preview for inspection
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: reading-site-preview
          path: build/site
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@v6
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
