name: Export EPUB separately

on:
  push:
    branches: [main]
    paths:
      - 'book.json'
      - 'frontmatter.md'
      - 'chapters/**'
      - 'appendices/**'
      - 'assets/**'
      - 'scripts/build_book.py'
      - 'scripts/check_book.py'
      - '.github/workflows/export.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install EPUB tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc
      - name: Build and validate EPUB
        run: python scripts/build_book.py
      - uses: actions/upload-artifact@v7
        with:
          name: Hearing-Instruments-EPUB
          path: build/Hearing-Instruments.epub
          if-no-files-found: error
          retention-days: 90
